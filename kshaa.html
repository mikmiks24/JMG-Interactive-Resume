<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster Truck Resume - Jessa Mae M. Ganan</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #133799;
  }

  canvas {
    display: inline-block;
    margin: auto;
    background: transparent;
  }

  #info {
    margin-top: 10px;
    font-size: 15px;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }

  #popup {
    display: none;
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    padding: 15px 25px;
    border: 2px solid #000;
    z-index: 10;
    font-size: 14px;
    max-width: 500px;
    text-align: center;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
  }

  #popup button {
    margin-top: 10px;
    padding: 8px 15px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>🛻 Monster Truck Resume</h1>
<p>Drive to unlock my resume details!</p>

<button id="startBtn">▶ START GAME</button>

<canvas id="game" width="1400" height="450"></canvas>

<div id="info">⬅️ ➡️ Move | SPACE Jump</div>

<div id="popup">
  <p id="popupText"></p>
  <button id="restartBtn" style="display:none;">Restart Game</button>
</div>

<!-- 🎵 BACKGROUND MUSIC -->
<audio id="song.mp4" loop>
  <source src="song.mp4" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const bgMusic = document.getElementById("song.mp4");

let gameStarted = false;
let gameFinished = false;

let truck = {
  x: 50,
  y: 270,
  width: 130,
  height: 100,
  dy: 0,
  gravity: 1,
  jumpPower: -25,
  grounded: true
};

let ground = 350;
let speed = 5;
let cameraX = 0;

let checkpointTexts = [
  "🎯 CAREER OBJECTIVE\n\nMotivated Computer Engineering graduate with a strong foundation in programming, data structures, and software development. Seeking an entry-level position to contribute and grow.",
  "👤 BASIC INFORMATION\n\nName: Jessa Mae M. Ganan\nSex: Female\nBirthday: May 18, 2005\nAddress: 9B Crossword 4th Estate, Parañaque City\nNationality: Filipino\nContact: 09197282447\nEmail: maeganan1418@gmail.com", 
  "EDUCATIONAL BACKGROUND\n\nPolytechnic University of the Philippines | Parañaque Campus (2023 – Present)\n• Assistant Chamberlain of ACES",
  "💼 EXPERIENCE\n\nMPT South (Aug – Nov 2025)\nTechnology Technical Support Intern (ITS and TSS Department)",
  "🛠️ SKILLS\n\nSOFT SKILLS:\n• Problem-solving\n• Communication\n• Teamwork\n• Adaptable\n\nTECHNICAL SKILLS:\n• C, C++, Java, Python\n• Basics of Networks, OS, Software Engineering",
  "✅ FINISH\n\nCongratulations! You have unlocked the entire resume."
];

let checkpointSpacing = 1000;
let checkpointWidth = 60;
let checkpointHeights = [120, 140, 160, 170, 180, 200];

let checkpoints = checkpointTexts.map((text, i) => ({
  x: 400 + i * checkpointSpacing,
  height: checkpointHeights[i] || 160,
  text,
  eggCollected: false,
  isLast: i === checkpointTexts.length - 1
}));

let keys = {};
let truckImage = new Image();
truckImage.src = "truck.png";

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

const startBtn = document.getElementById("startBtn");
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");
const restartBtn = document.getElementById("restartBtn");

startBtn.onclick = () => {
  gameStarted = true;
  gameFinished = false;
  startBtn.style.display = "none";
  restartBtn.style.display = "none";
  popup.style.display = "none";
  resetGame();

  bgMusic.volume = 0.4;
  bgMusic.play();
};

restartBtn.onclick = () => {
  popup.style.display = "none";
  resetGame();
  gameStarted = true;
  gameFinished = false;
  restartBtn.style.display = "none";

  bgMusic.currentTime = 0;
  bgMusic.play();
};

function resetGame() {
  truck.x = 50;
  truck.y = 250;
  truck.dy = 0;
  truck.grounded = true;
  cameraX = 0;

  checkpoints.forEach((cp, i) => {
    cp.x = 400 + i * checkpointSpacing;
    cp.height = checkpointHeights[i] || 160;
    cp.eggCollected = false;
  });
}

function update() {
  if (!gameStarted) {
    draw();
    requestAnimationFrame(update);
    return;
  }

  if (!gameFinished) {
    if (keys["ArrowRight"]) truck.x += speed;
    if (keys["ArrowLeft"]) truck.x -= speed;
    cameraX = truck.x - canvas.width / 2;
  }

  if (keys["Space"] && truck.grounded) {
    truck.dy = truck.jumpPower;
    truck.grounded = false;
  }

  truck.dy += truck.gravity;
  truck.y += truck.dy;

  if (truck.y >= ground - truck.height) {
    truck.y = ground - truck.height;
    truck.dy = 0;
    truck.grounded = true;
  }

  checkpoints.forEach(cp => {
    if (
      truck.x + truck.width > cp.x &&
      truck.x < cp.x + checkpointWidth &&
      truck.y + truck.height > ground - cp.height
    ) {
      truck.x -= speed;
    }

    let eggX = cp.x + checkpointWidth / 2;
    let eggY = ground - cp.height - 50;

    if (
      !cp.eggCollected &&
      truck.x + truck.width > eggX - 30 &&
      truck.x < eggX + 30 &&
      truck.y < eggY + 35 &&
      truck.y + truck.height > eggY - 35
    ) {
      cp.eggCollected = true;
      popupText.innerText = cp.text;
      popup.style.display = "block";

      if (cp.isLast) {
        restartBtn.style.display = "inline-block";
        gameFinished = true;
      } else {
        setTimeout(() => popup.style.display = "none", 2000);
      }
    }
  });

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#555";
  ctx.fillRect(0, ground, canvas.width, canvas.height - ground);

  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 5;
  ctx.setLineDash([40, 30]);
  ctx.beginPath();
  ctx.moveTo(-cameraX % 70, ground + 30);
  ctx.lineTo(canvas.width, ground + 30);
  ctx.stroke();
  ctx.setLineDash([]);

  if (truckImage.complete) {
    ctx.drawImage(truckImage, truck.x - cameraX, truck.y, truck.width, truck.height);
  } else {
    ctx.fillStyle = "red";
    ctx.fillRect(truck.x - cameraX, truck.y, truck.width, truck.height);
  }

  checkpoints.forEach(cp => {
    ctx.fillStyle = "yellow";
    ctx.fillRect(cp.x - cameraX, ground - cp.height, checkpointWidth, cp.height);

    if (!cp.eggCollected && !cp.isLast) {
      ctx.fillStyle = "#90EE90";
      ctx.beginPath();
      ctx.ellipse(cp.x - cameraX + 25, ground - cp.height - 40, 14, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#228B22";
      ctx.stroke();
    }
  });
}

update();
</script>
</body>
</html>
